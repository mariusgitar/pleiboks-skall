<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pleiboks</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box;
         background:linear-gradient(180deg,#AEE4FF 0%,#C8F0FF 45%,#DAFFC8 100%); font-family:system-ui,sans-serif; color:#1B2B33; }
  .kort { background:#fff; border-radius:28px; padding:32px 26px; max-width:360px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.18); }
  .ikon { font-size:56px; margin-bottom:12px; }
  h1 { font-size:22px; margin:0 0 10px; color:#1B4D5C; }
  p { font-size:15px; line-height:1.5; color:#555; margin:0 0 24px; }
  button { width:100%; min-height:52px; border:none; border-radius:16px; background:#1B4D5C; color:#fff; font-size:16px; font-weight:800; }
</style>
</head>
<body>
  <div class="kort">
    <div class="ikon">📶</div>
    <h1>Pleiboksen trenger nett</h1>
    <p>Første gang må telefonen være koblet til wifi. Etterpå virker lagrede episoder uten nett.</p>
    <button onclick="window.PleiboksSkall ? PleiboksSkall.provIgjen() : location.reload()">Prøv igjen</button>
  </div>
</body>
</html>
