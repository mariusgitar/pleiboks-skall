name: Bygg APK

on:
  push:
  workflow_dispatch:
    inputs:
      url:
        description: "Adressen skallet skal åpne"
        required: false
        default: "https://pleiboks.vercel.app/"

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Signeringsnøkkel
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/boks.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/boks.jks" >> "$GITHUB_ENV"

      - name: Bygg
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon -PpleiboksUrl="${{ github.event.inputs.url || 'https://pleiboks.vercel.app/' }}"

      - name: Gi filen et fast navn
        run: cp app/build/outputs/apk/release/app-release.apk pleiboks-boks.apk

      - name: Publiser som utgivelse
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Pleiboks-boks ${{ github.run_number }}${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          files: pleiboks-boks.apk
          body: |
            Last ned **pleiboks-boks.apk** på Android-telefonen og åpne den for å installere.
            Gren: `${{ github.ref_name }}` · Åpner: ${{ github.event.inputs.url || 'https://pleiboks.vercel.app/' }}
